<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Wolf Art</title>

    <!-- Website styling -->
    <link rel="stylesheet" href="./style.css">

    <!-- Import map for Three.js modules -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
    }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #10141c;
        }

        #viewer {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
        }

        #reset {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            padding: 12px 28px;
            border: 1px solid #667f99;
            border-radius: 30px;

            background: rgba(20, 26, 36, 0.9);
            color: #ffffff;

            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        #reset:hover {
            background: #667f99;
        }

        #title {
            position: fixed;
            top: 25px;
            left: 0;
            width: 100%;
            z-index: 5;

            text-align: center;
            color: #c0c5cc;
            font-family: Arial, sans-serif;
            font-size: 22px;
            letter-spacing: 5px;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <h1 id="title">WOLF</h1>

    <!-- Three.js rendering canvas -->
    <canvas id="viewer"></canvas>

    <!-- Reset camera button -->
    <button id="reset" type="button">
        RESET VIEW
    </button>

    <!-- Main 3D script -->
    <script type="module" src="./script.js"></script>

</body>
</html>
