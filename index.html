
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Broken Wolf Art</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101010;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        h1 {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            font-size: 28px;
            letter-spacing: 4px;
            z-index: 1;
        }

        p {
            position: absolute;
            top: 70px;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-size: 14px;
            z-index: 1;
        }

        #viewer {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }

        #reset {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            background: white;
            color: black;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
        }

        #reset:hover {
            background: #ccc;
        }
    </style>
</head>

<body>

    <h1>3D ART GALLERY</h1>
    <p>Rotate the sculpture to discover the hidden wolf</p>

    <canvas id="viewer"></canvas>

    <button id="reset">Reset View</button>

    <script type="module">
        import * as THREE from
            'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

        import { OrbitControls } from
            'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js';

        // =========================
        // SCENE
        // =========================

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x101010);

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0, 0, 9);

        const renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById("viewer"),
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        // =========================
        // CONTROLS
        // =========================

        const controls = new OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        controls.enableZoom = true;
        controls.enablePan = false;

        controls.minDistance = 4;
        controls.maxDistance = 15;

        // =========================
        // LIGHTING
        // =========================

        scene.add(
            new THREE.AmbientLight(0xffffff, 1.5)
        );

        const light = new THREE.DirectionalLight(
            0xffffff,
            3
        );

        light.position.set(5, 5, 8);
        scene.add(light);

        const backLight = new THREE.PointLight(
            0x6699ff,
            30
        );

        backLight.position.set(-4, 2, -4);
        scene.add(backLight);

        // =========================
        // ARTWORK
        // =========================

        const artwork = new THREE.Group();
        scene.add(artwork);

        const fragments = new THREE.Group();
        artwork.add(fragments);

        const wolfMaterial = new THREE.MeshStandardMaterial({
            color: 0xb5b5b5,
            metalness: 0.5,
            roughness: 0.3,
            flatShading: true
        });

        const darkMaterial = new THREE.MeshStandardMaterial({
            color: 0x555555,
            metalness: 0.6,
            roughness: 0.35,
            flatShading: true
        });

        // =========================
        // WOLF SILHOUETTE
        // =========================

        const wolfShape = new THREE.Shape();

        wolfShape.moveTo(-2.1, 0.2);

        // Head and ears
        wolfShape.lineTo(-2.4, 0.7);
        wolfShape.lineTo(-2.3, 1.7);
        wolfShape.lineTo(-1.7, 1.2);
        wolfShape.lineTo(-1.1, 1.5);
        wolfShape.lineTo(-0.6, 1.3);

        // Back
        wolfShape.lineTo(0.3, 0.9);
        wolfShape.lineTo(1.1, 0.8);
        wolfShape.lineTo(1.8, 1.2);

        // Tail
        wolfShape.lineTo(2.5, 1.5);
        wolfShape.lineTo(2.3, 0.9);
        wolfShape.lineTo(1.8, 0.4);

        // Body
        wolfShape.lineTo(2.1, -0.2);
        wolfShape.lineTo(1.6, -0.6);
        wolfShape.lineTo(1.1, -0.6);

        // Front leg
        wolfShape.lineTo(0.8, -1.5);
        wolfShape.lineTo(0.3, -1.5);
        wolfShape.lineTo(0.2, -0.5);

        // Belly
        wolfShape.lineTo(-0.8, -0.5);

        // Back leg
        wolfShape.lineTo(-1.1, -1.5);
        wolfShape.lineTo(-1.6, -1.5);
        wolfShape.lineTo(-1.5, -0.4);

        // Neck and jaw
        wolfShape.lineTo(-2.1, -0.2);
        wolfShape.lineTo(-2.5, 0.1);

        wolfShape.closePath();

        // =========================
        // FRAGMENT GENERATION
        // =========================

        const points = wolfShape.getPoints(100);

        const isInsideWolf = (x, y) => {
            return THREE.ShapeUtils.isPointInsidePolygon(
                new THREE.Vector2(x, y),
                points
            );
        };

        // Create randomly scattered fragments
        // within the wolf silhouette.

        for (let i = 0; i < 350; i++) {

            const x = THREE.MathUtils.randFloat(-2.5, 2.5);
            const y = THREE.MathUtils.randFloat(-1.5, 1.7);

            if (!isInsideWolf(x, y)) {
                continue;
            }

            const size = THREE.MathUtils.randFloat(
                0.06,
                0.16
            );

            const geometry = new THREE.TetrahedronGeometry(
                size,
                0
            );

            const material = Math.random() > 0.3
                ? wolfMaterial
                : darkMaterial;

            const piece = new THREE.Mesh(
                geometry,
                material
            );

            piece.position.set(
                x,
                y,
                THREE.MathUtils.randFloat(-0.3, 0.3)
            );

            piece.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );

            fragments.add(piece);
        }

        // =========================
        // EXTRA FLOATING FRAGMENTS
        // =========================

        for (let i = 0; i < 60; i++) {

            const size = THREE.MathUtils.randFloat(
                0.04,
                0.14
            );

            const geometry = new THREE.TetrahedronGeometry(
                size,
                0
            );

            const piece = new THREE.Mesh(
                geometry,
                Math.random() > 0.5
                    ? wolfMaterial
                    : darkMaterial
            );

            piece.position.set(
                THREE.MathUtils.randFloat(-3.5, 3.5),
                THREE.MathUtils.randFloat(-2.5, 2.5),
                THREE.MathUtils.randFloat(-1.5, 1.5)
            );

            fragments.add(piece);
        }

        // =========================
        // RESET VIEW
        // =========================

        document.getElementById("reset").addEventListener(
            "click",
            () => {
                camera.position.set(0, 0, 9);

                controls.target.set(0, 0, 0);

                controls.update();
            }
        );

        // =========================
        // RESIZE
        // =========================

        window.addEventListener("resize", () => {

            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        });

        // =========================
        // ANIMATION
        // =========================

        function animate() {

            requestAnimationFrame(animate);

            controls.update();

            renderer.render(scene, camera);
        }

        animate();

    </script>

</body>
</html>
